[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "remedy-canvas-lti"
version = "0.1.0"
description = "Canvas LMS LTI 1.3 Accessibility Remediation Tool"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    # Core
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",

    # LTI 1.3
    "pylti1p3>=2.0.0",

    # Database (Postgres + pgvector)
    "psycopg[binary]>=3.1.0",
    "pgvector>=0.3.0",

    # Auth / Security
    "cryptography>=41.0.0",
    "pyjwt>=2.8.0",
    "jwcrypto>=1.5.6",

    # HTML Processing
    "beautifulsoup4>=4.12.0",
    "lxml>=5.1.0",

    # AI
    "Pillow>=10.2.0",
    "openai>=1.0.0",

    # Captions / Audio
    "yt-dlp>=2024.0.0",
    "silero-vad>=5.1",
    "onnxruntime>=1.16.0",
    "soundfile>=0.12",
    "sse-starlette>=1.8.0",

    # PDF
    "pikepdf>=9.0.0",
    "pypdf>=5.1.0",
    "PyMuPDF>=1.24.0",

    # Documents (LiteParse handles PDF, DOCX, PPTX, XLSX)
    "liteparse>=1.2.0",

    # Validation
    "playwright>=1.40.0",

    # Utilities
    "python-ulid>=2.2.0",
    "aiofiles>=23.2.1",
    "wcag-contrast-ratio>=0.9",
    "structlog>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.35.0",
    "httpx",
    "ruff>=0.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["lti_app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
