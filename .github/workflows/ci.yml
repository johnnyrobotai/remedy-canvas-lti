name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Python dependencies
        run: pip install -e '.[dev]'

      - name: Ruff
        run: ruff check

      - name: Compile Python sources
        run: python -m compileall -q lti_app scripts tests

      - name: Pytest
        run: pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker and Compose
    runs-on: ubuntu-latest
    needs: [python, frontend]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Mock required Compose environment
        run: cp tests/fixtures/compose.ci.env .env

      - name: Validate Compose config
        run: docker compose --env-file tests/fixtures/compose.ci.env config --quiet

      - name: Build Docker image
        run: docker build --pull --tag remedy-canvas-lti:ci .
